<div
  class="flex h-screen flex-col overflow-hidden bg-(--p-content-background) text-(--p-text-color)"
>
  <header
    class="grid h-11 select-none grid-cols-[200px_minmax(0,1fr)_auto] items-center border-b border-(--p-content-border-color) bg-(--p-content-background)"
  >
    <div
      class="flex h-full min-w-0 items-center border-r border-(--p-content-border-color) px-3.5"
      data-tauri-drag-region
      (dblclick)="handleTitlebarDoubleClick()"
    >
      <span class="truncate text-[14px] font-semibold uppercase tracking-[0.08em]">dandelion</span>
    </div>
    <div
      class="flex h-full min-w-0 items-center px-3.5"
      data-tauri-drag-region
      (dblclick)="handleTitlebarDoubleClick()"
    >
      <span class="truncate text-[14px] text-(--p-text-muted-color)">{{ currentPageTitle() }}</span>
    </div>
    <div class="flex h-full items-stretch">
      <button
        class="inline-flex w-12 cursor-pointer items-center justify-center border-0 bg-transparent text-(--p-text-color) transition-colors hover:bg-(--p-content-hover-background)"
        type="button"
        aria-label="最小化"
        (click)="minimizeWindow()"
      >
        <svg lucideMinus class="block h-4.5 w-4.5" [size]="18"></svg>
      </button>
      <button
        class="inline-flex w-12 cursor-pointer items-center justify-center border-0 bg-transparent text-(--p-text-color) transition-colors hover:bg-(--p-content-hover-background)"
        type="button"
        [attr.aria-label]="isMaximized() ? '还原窗口' : '最大化窗口'"
        (click)="toggleWindowMaximize()"
      >
        @if (isMaximized()) {
          <app-window-restore-icon class="block" [size]="16"></app-window-restore-icon>
        } @else {
          <svg lucideSquare class="block" [size]="16"></svg>
        }
      </button>
      <button
        class="inline-flex w-12 cursor-pointer items-center justify-center border-0 bg-transparent text-(--p-text-color) transition-colors hover:bg-(--p-red-500) hover:text-white"
        type="button"
        aria-label="关闭窗口"
        (click)="closeWindow()"
      >
        <svg lucideX class="block h-4.5 w-4.5" [size]="18"></svg>
      </button>
    </div>
  </header>
  <router-outlet />
</div>
